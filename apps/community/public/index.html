<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f4f2fa" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="초대 기반 공동 봇 대화" />
    <link rel="preload" href="/icons/cloud-agent-v1-192.png" as="image">
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/app-icon-v2-48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/icons/app-icon-v2-180.png" sizes="180x180" />
    <title>CustomCloudBot</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/branch-graph.css" />
    <link rel="stylesheet" href="/routines.css" />
    <link rel="stylesheet" href="/voice-call.css" />
    <link rel="stylesheet" href="/desktop.css" />
    <link rel="stylesheet" href="/setup.css" />
    <link rel="stylesheet" href="/mail.css" />
    <link rel="stylesheet" href="/agent-presence.css" />
    <link rel="stylesheet" href="/notification-center.css" />
    <link rel="stylesheet" href="/profile-settings.css" />
    <link rel="stylesheet" href="/room-sharing.css" />
    <link rel="stylesheet" href="/glass.css" />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/messages.css" />
    <link rel="stylesheet" href="/navigation.css" />
    <link rel="stylesheet" href="/composer.css" />
    <link rel="stylesheet" href="/dashboard.css" />
  </head>
  <body>
    <svg
      class="icon-definitions"
      aria-hidden="true"
      xmlns="http://www.w3.org/2000/svg"
    >
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/></symbol>
      <symbol id="i-fork" viewBox="0 0 24 24"><path d="M4 12h6l8-8m-8 8 8 8M13 4h5v5m-5 11h5v-5"/></symbol>
      <symbol id="i-merge" viewBox="0 0 24 24"><path d="M6 4v6a4 4 0 0 0 4 4h8M14 10l4 4-4 4M6 20v-2"/></symbol>
      <symbol id="i-agent" viewBox="0 0 24 24"><path d="M7 4h10a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4Z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 10v3m8-3v3m-7 4h6M10 4V2m4 2V2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
      <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></symbol>
      <symbol id="i-phone" viewBox="0 0 24 24"><path d="M7 3H4a1 1 0 0 0-1 1c0 9.4 7.6 17 17 17a1 1 0 0 0 1-1v-3l-5-2-2 2a14 14 0 0 1-7-7l2-2-2-5Z"/></symbol>
<symbol id="i-chat" viewBox="0 0 24 24"><path d="M5 5h14v11H9l-4 3V5Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
<symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3c0 6-3 9-9 9 6 0 9 3 9 9 0-6 3-9 9-9-6 0-9-3-9-9Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
<symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" />
      </symbol>
      <symbol id="i-more" viewBox="0 0 24 24">
        <circle cx="6" cy="12" r="1.5" fill="currentColor" stroke="none" />
        <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none" />
        <circle cx="18" cy="12" r="1.5" fill="currentColor" stroke="none" />
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="10.5" cy="10.5" r="6.5" />
        <path d="m16 16 4 4" />
      </symbol>
      <symbol id="i-people" viewBox="0 0 24 24">
        <circle cx="9" cy="8" r="3" />
        <path
          d="M3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 4v2"
        />
      </symbol>
      <symbol id="i-invite" viewBox="0 0 24 24">
        <circle cx="9" cy="8" r="3" />
        <path d="M3 20v-2a6 6 0 0 1 12 0v2M19 8v6M16 11h6" />
      </symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24">
        <path d="M12 19V5m-6 6 6-6 6 6" />
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24">
        <path d="m6 6 12 12M6 18 18 6" />
      </symbol>
      <symbol id="i-menu" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="3" />
        <path d="M9 4v16" />
      </symbol>
      <symbol id="i-join" viewBox="0 0 24 24">
        <path
          d="M14 4h5a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-5M3 12h12m-4-4 4 4-4 4"
        />
      </symbol>
      <symbol id="i-bot" viewBox="0 0 24 24">
        <rect x="4" y="7" width="16" height="13" rx="5" />
        <path d="M12 3v4M8 12v3M16 12v3" />
      </symbol>
      <symbol id="i-attach" viewBox="0 0 24 24">
        <path d="m20 11-8.5 8.5a5 5 0 0 1-7-7L13 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L14 7" />
      </symbol>
      <symbol id="i-mic" viewBox="0 0 24 24">
        <rect x="8" y="3" width="8" height="12" rx="4" />
        <path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6" />
      </symbol>
    </svg>
    <div id="app">
      <section id="startup-view" class="startup-view" aria-label="CustomCloudBot 불러오는 중">
        <img class="icon agent-art startup-logo" src="/icons/cloud-agent-v1-192.png" alt="" width="144" height="144" fetchpriority="high" decoding="sync" draggable="false">
        <strong data-product-name>CustomCloudBot</strong>
        <p id="startup-status" role="status">내 공간을 불러오고 있어요</p>
        <button id="startup-retry" class="is-hidden" type="button">다시 시도</button>
        <noscript>JavaScript를 켜면 내 공간에 연결할 수 있습니다.</noscript>
      </section>
      <section id="auth-view" class="auth-view is-hidden" aria-labelledby="auth-title">
        <div class="auth-panel">
          <div class="auth-brand">
            <img class="brand-art auth-logo" src="/icons/cloud-agent-v1-192.png" alt="" width="96" height="96" draggable="false">
            <h1 id="auth-title" data-product-name>CustomCloudBot</h1>
          </div>
          <p class="auth-description">초대받은 계정으로 로그인하세요.</p>
          <div class="auth-tabs" role="tablist" aria-label="인증 방식">
            <button
              class="tab-button is-active"
              type="button"
              data-auth-tab="login"
              role="tab"
              aria-selected="true"
            >
              로그인
            </button>
            <button
              class="tab-button"
              type="button"
              data-auth-tab="register"
              role="tab"
              aria-selected="false"
            >
              초대 가입
            </button>
          </div>
          <form id="login-form" class="auth-form">
            <label for="login-username">사용자 이름</label
            ><input
              id="login-username"
              name="username"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              required
              maxlength="40"
            />
            <label for="login-password">비밀번호</label
            ><input
              id="login-password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              minlength="10"
            />
            <button class="primary-button full" type="submit">로그인</button>
          </form>
          <form id="register-form" class="auth-form is-hidden">
            <label for="register-display">표시 이름</label
            ><input
              id="register-display"
              name="displayName"
              autocomplete="name"
              required
              maxlength="60"
            />
            <label for="register-username">사용자 이름</label
            ><input
              id="register-username"
              name="username"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              required
              maxlength="40"
              placeholder="영문, 숫자, 밑줄 3자 이상"
            />
            <label for="register-password"
              >비밀번호 <span class="hint">10자 이상</span></label
            ><input
              id="register-password"
              name="password"
              type="password"
              autocomplete="new-password"
              required
              minlength="10"
            />
            <label id="register-token-label" for="register-token">가입 초대 코드</label
            ><input
              id="register-token"
              name="inviteToken"
              autocomplete="off"
              autocapitalize="none"
              spellcheck="false"
              required
            />
            <button class="primary-button full" type="submit">
              계정 만들기
            </button>
          </form>
          <p
            id="auth-message"
            class="form-message"
            role="status"
            aria-live="polite"
          ></p>
          <button id="auth-install-button" class="outline-button auth-install-button is-hidden" type="button">홈 화면에 추가</button>
        </div>
      </section>
      <section id="workspace-view" class="workspace-view is-hidden">
        <aside id="sidebar" class="sidebar" aria-label="대화 목록" tabindex="-1">
          <div id="sidebar-resizer" class="sidebar-resizer" role="separator" tabindex="0" aria-label="대화 목록 너비 조절" aria-controls="sidebar" aria-orientation="vertical" aria-valuemin="200" aria-valuemax="420" aria-valuenow="280" aria-disabled="true"></div>
          <div class="sidebar-top">
            <div id="agent-presence" class="agent-presence" aria-label="에이전트"></div>
            <button id="create-room-button" class="sidebar-new" type="button">
              <svg class="icon" aria-hidden="true"><use href="#i-plus" /></svg><span>새 대화</span>
            </button>
            <button id="room-search-toggle" class="sidebar-tool" type="button" aria-label="대화 찾기" title="대화 찾기" aria-expanded="false" aria-controls="room-search-field">
              <svg class="icon" aria-hidden="true"><use href="#i-search" /></svg>
            </button>
            <button
              id="mobile-close"
              class="sidebar-tool mobile-only"
              type="button"
              aria-label="대화 목록 닫기"
            >
              <svg class="icon" aria-hidden="true"><use href="#i-close" /></svg>
            </button>
          </div>
          <div id="room-search-field" class="sidebar-search" role="search" hidden>
            <svg class="icon" aria-hidden="true"><use href="#i-search" /></svg>
            <input id="room-search" type="search" placeholder="대화 이름으로 찾기" aria-label="대화 이름으로 찾기" autocomplete="off" enterkeyhint="search" />
            <button id="room-search-close" type="button" aria-label="찾기 닫기"><svg class="icon" aria-hidden="true"><use href="#i-close" /></svg></button>
          </div>
          <button id="create-sidebar-group" type="button" hidden disabled>+ 그룹</button>
          <nav id="room-list" class="room-list" aria-label="대화 분기 그래프"></nav>
          <div class="sidebar-bottom">
            <div class="profile-row">
              <button id="profile-customize" class="profile-customize profile-menu-trigger" type="button" aria-label="계정 및 도구 메뉴" aria-haspopup="dialog" aria-expanded="false" aria-controls="profile-menu">
              <div id="profile-avatar" class="avatar">?</div>
              <div class="profile-copy">
                <strong id="profile-name">사용자</strong
                ><span id="profile-role"></span>
              </div>
              <span class="profile-menu-chevron" aria-hidden="true">⌃</span>
              </button>
            </div>
            <dialog id="profile-menu" class="profile-menu" aria-label="계정 및 도구">
              <div class="profile-menu-section">
                <span class="profile-menu-heading">내 공간</span>
                <button id="edit-profile-button" class="profile-menu-item" type="button">프로필 꾸미기</button>
                <button id="restore-conversations" class="profile-menu-item" type="button">대화 복원</button>
              </div>
              <div class="profile-menu-section">
                <span class="profile-menu-heading">도구</span>
                <button id="open-dashboard" class="profile-menu-item is-hidden" type="button">대시보드</button>
                <button id="open-mail" class="profile-menu-item is-hidden" type="button" data-admin-tool>메일</button>
                <button id="open-capability-hub" class="profile-menu-item is-hidden" type="button" data-admin-tool>통합 관리</button>
                <button id="open-bot-setup" class="profile-menu-item is-hidden" type="button" data-admin-tool>내 봇 설정</button>
                <button id="open-routines" class="profile-menu-item" type="button">루틴</button>
              </div>
              <div class="profile-menu-section">
                <button id="site-invite-button" class="profile-menu-item is-hidden" type="button">사용자 초대</button>
                <button id="install-button" class="profile-menu-item is-hidden" type="button">앱으로 설치</button>
                <button id="logout-button" class="profile-menu-item" type="button">로그아웃</button>
              </div>
            </dialog>
          </div>
        </aside>
        <div id="sidebar-scrim" class="sidebar-scrim"></div>
        <main class="main-panel">
          <header class="topbar">
            <div class="topbar-leading">
            <button
              id="mobile-menu"
              class="icon-button"
              type="button"
              aria-label="대화 목록" aria-controls="sidebar" aria-expanded="true"
            >
              <svg class="icon"><use href="#i-menu" /></svg>
            </button>
            <div class="header-identity">
              <h1 id="room-title">대화</h1>
            </div>
            <button id="room-info-button" class="room-info-button" type="button" aria-controls="member-panel" aria-expanded="false">
              <span id="room-info-title" class="room-info-title">대화</span>
              <span class="room-info-meta"><span id="room-info-meta"></span><span class="room-info-demo">데모 · 실제 AI 미연결</span></span>
            </button>
            </div>
            <span id="mobile-room-title" class="sr-only"></span
            ><span id="room-kicker" class="sr-only"></span>
            <div class="topbar-actions">
              <span
                id="demo-badge"
                class="demo-badge is-hidden"
                title="실제 AI가 연결되지 않은 기능 미리보기"
                >데모 · 실제 AI 미연결</span
              ><button
                id="members-toggle"
                class="icon-button members-button"
                type="button"
                aria-label="참여자 보기"
                aria-controls="member-panel"
                aria-expanded="false"
                title="참여자"
              >
                <svg class="icon" aria-hidden="true"><use href="#i-people" /></svg><span id="member-count">0</span></button
              ><button
                id="room-invite-button"
                class="icon-button is-hidden"
                type="button"
                aria-label="대화에 초대"
                title="대화에 초대"
              >
                <svg class="icon"><use href="#i-invite" /></svg>
              </button>
              <button id="voice-call-button" class="icon-button voice-call-button" type="button" aria-label="이 대화에 전화하기" title="이 대화에 전화하기"><svg class="icon" aria-hidden="true"><use href="#i-phone"/></svg></button>
            </div>
          </header>
          <div class="workspace-notifications"><div id="notification-center"></div></div>
          <div id="pane-grid" class="pane-grid" data-panes="1">
          <section id="empty-state" class="empty-state is-hidden">
            <h2>새 대화</h2>
            <p>대화를 만들어 시작하세요.</p>
            <button
              id="empty-create-button"
              class="outline-button"
              type="button"
            >
              대화 만들기
            </button>
          </section>
          <section
            id="room-view"
            class="room-view is-hidden"
            aria-labelledby="room-title"
          >
            <div
              id="model-warning"
              class="model-warning is-hidden"
              role="status"
            >
              AI 모델이 연결되지 않았습니다. 메시지는 참여자들과 공유됩니다.
            </div>
            <div
              id="message-list"
              class="message-list"
              role="log"
              aria-label="대화 내용"
            ></div>
            <div class="composer-dock">
              <div
                id="sending-status"
                class="sending-status"
                role="status"
                aria-live="polite"
              ></div>
              <form id="composer-form" class="composer">
                <div
                  id="bot-picker"
                  class="bot-picker composer-popover is-hidden"
                  role="group"
                  aria-label="응답할 봇 선택"
                ></div>
                <div id="attachment-list" class="attachment-list" aria-label="첨부 파일" aria-live="polite"></div>
                <div class="composer-input">
                  <label class="sr-only" for="message-input">메시지 입력</label
                  ><textarea
                    id="message-input"
                    rows="1"
                    maxlength="4000"
                    enterkeyhint="send"
                    placeholder="무엇을 함께 해볼까요?"
                  ></textarea
                  ><span class="composer-usage-inline"></span>
                  <div id="recording-bar" class="recording-bar" hidden>
                    <span class="recording-dot" aria-hidden="true"></span
                    ><span class="recording-copy" role="timer" aria-live="off"
                      ><span class="recording-title">녹음 중</span>
                      <time id="recording-time">0:00</time
                      ><span class="recording-limit"> / 2:00</span></span
                    ><button id="record-cancel-button" class="recording-action recording-cancel" type="button">취소</button
                    ><button id="record-done-button" class="recording-action recording-done" type="button">첨부</button>
                  </div>
                </div>
                <div class="model-controls composer-toolbar">
                  <div class="composer-tools">
                    <button
                      id="attach-button"
                      class="composer-icon attach-button"
                      type="button"
                      aria-label="사진 또는 음성 첨부"
                      title="사진 또는 음성 첨부"
                    >
                      <svg class="icon"><use href="#i-attach" /></svg></button
                    ><input id="attachment-input" class="sr-only" type="file" accept="image/*,audio/*" multiple tabindex="-1" aria-hidden="true" /><button
                      id="bot-picker-button"
                      class="composer-chip bot-chip"
                      type="button"
                      aria-label="응답할 봇 선택"
                      title="응답할 봇 선택"
                      aria-expanded="false"
                      aria-controls="bot-picker"
                    >
                      <svg class="icon" aria-hidden="true"><use href="#i-bot" /></svg
                      ><span id="bot-chip-label" class="composer-chip-label">봇</span>
                    </button>
                    <span class="model-fields" hidden>
                      <label>모델
                        <select id="model-select" class="model-select" aria-label="모델" tabindex="-1">
                          <option value="">자동 순환</option>
                        </select>
                      </label>
                      <label>생각 깊이
                        <select id="effort-select" class="effort-select" aria-label="생각 깊이" tabindex="-1">
                          <option value="">기본</option>
                          <option value="low">낮게</option>
                          <option value="medium">보통</option>
                          <option value="high">높게</option>
                          <option value="xhigh">최대</option>
                        </select>
                      </label>
                    </span>
                    <div id="composer-more" class="composer-more">
                      <button
                        id="composer-more-button"
                        class="composer-icon composer-more-button"
                        type="button"
                        aria-label="대화 도구 더 보기"
                        title="참여자 · 초대 · 전화 · 작업 공간 · 알림"
                        aria-expanded="false"
                        aria-controls="composer-more-menu"
                      >
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.4" /><circle cx="12" cy="12" r="1.4" /><circle cx="18.5" cy="12" r="1.4" /></svg>
                      </button>
                      <div id="composer-more-menu" class="composer-more-menu composer-popover is-hidden" aria-label="대화 도구">
                        <button id="composer-notice-item" class="composer-menu-item composer-notice-item" type="button">
                          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" /></svg
                          ><span>알림</span><span id="composer-notice-count" class="composer-menu-count" hidden></span>
                        </button>
                      </div>
                    </div>
                  </div>
                  <div class="composer-send">
                    <span class="composer-usage-slot"></span
                    ><button
                      id="record-button"
                      class="composer-icon record-button"
                      type="button"
                      aria-label="음성 녹음 시작"
                      title="음성 녹음"
                    >
                      <svg class="icon"><use href="#i-mic" /></svg></button
                    ><button
                      id="send-button"
                      class="send-button"
                      type="submit"
                      aria-label="메시지 보내기"
                    >
                      <svg class="icon"><use href="#i-arrow" /></svg>
                    </button>
                  </div>
                </div>
              </form>
              <div class="composer-caption">
                <span id="bot-picker-label">AI 답변 꺼짐 · 사람끼리 대화</span
                ><span id="usage-label"></span>
              </div>
            </div>
          </section>
          </div>
        </main>
        <div id="member-scrim" class="member-scrim"></div>
        <aside id="member-panel" class="member-panel" aria-labelledby="member-panel-title" tabindex="-1">
          <div class="member-panel-head">
            <h2 id="member-panel-title">대화 정보</h2>
            <button
              id="member-close"
              class="icon-button"
              type="button"
              aria-label="대화 정보 닫기"
            >
              <svg class="icon" aria-hidden="true"><use href="#i-close" /></svg>
            </button>
          </div>
          <div class="member-room">
            <strong id="member-room-name" class="member-room-name"></strong>
            <p id="room-description" class="room-description"></p>
          </div>
          <div class="member-section-head">
            <h3 id="member-heading">참여자</h3><span id="member-total" class="member-total"></span>
          </div>
          <label id="member-search-field" class="member-search" hidden>
            <span class="sr-only">참여자 이름으로 찾기</span>
            <svg class="icon" aria-hidden="true"><use href="#i-search" /></svg>
            <input id="member-search" type="search" placeholder="이름으로 찾기" autocomplete="off" />
          </label>
          <div id="member-list" class="member-list" role="list" aria-labelledby="member-heading"></div>
        </aside>
      </section>
    </div>
    <dialog id="room-dialog" class="modal">
      <form id="room-form">
        <div class="modal-head">
          <h2>새 대화</h2>
          <button
            class="icon-button modal-close"
            type="button"
            aria-label="닫기"
          >
            <svg class="icon"><use href="#i-close" /></svg>
          </button>
        </div>
        <label for="room-name">이름</label
        ><input
          id="room-name"
          name="name"
          required
          maxlength="80"
          autocomplete="off"
        /><label for="room-description-input"
          >설명 <span class="hint">선택</span></label
        ><textarea
          id="room-description-input"
          name="description"
          maxlength="240"
          rows="3"
        ></textarea>
        <p id="room-form-message" class="form-message" role="status"></p>
        <div class="modal-actions">
          <button class="outline-button modal-cancel" type="button">취소</button
          ><button class="primary-button" type="submit">만들기</button>
        </div>
      </form>
    </dialog>
    <dialog id="image-dialog" class="image-dialog" aria-label="사진 보기">
      <button id="image-dialog-close" class="icon-button" type="button" aria-label="사진 닫기">
        <svg class="icon"><use href="#i-close" /></svg>
      </button>
      <figure class="image-viewer">
        <p id="image-dialog-status" class="image-viewer-status" role="status"></p>
        <img id="image-dialog-image" alt="" />
        <figcaption id="image-dialog-caption"></figcaption>
      </figure>
    </dialog>
    <dialog id="join-dialog" class="modal">
      <form id="join-form">
        <div class="modal-head">
          <h2>대화에 참여</h2>
          <button
            class="icon-button modal-close"
            type="button"
            aria-label="닫기"
          >
            <svg class="icon"><use href="#i-close" /></svg>
          </button>
        </div>
        <p id="join-invite-note" class="modal-copy is-hidden">초대받은 대화에 참여할까요?</p>
        <label id="join-token-label" for="join-token">대화 초대 코드</label
        ><input
          id="join-token"
          name="token"
          required
          autocomplete="off"
          autocapitalize="none"
          spellcheck="false"
        />
        <p id="join-form-message" class="form-message" role="status"></p>
        <div class="modal-actions">
          <button class="outline-button modal-cancel" type="button">취소</button
          ><button class="primary-button" type="submit">참여하기</button>
        </div>
      </form>
    </dialog>
    <dialog id="invite-dialog" class="modal invite-modal">
      <form method="dialog">
        <div class="modal-head">
          <h2>초대 링크</h2>
          <button
            class="icon-button modal-close"
            type="button"
            aria-label="닫기"
          >
            <svg class="icon"><use href="#i-close" /></svg>
          </button>
        </div>
        <p class="eyebrow sr-only"></p>
        <p class="modal-copy">24시간 안에 한 번 사용할 수 있습니다.</p>
        <div class="token-box">
          <code id="invite-token"></code
          ><button id="copy-invite" class="outline-button" type="button">
            복사
          </button>
        </div>
        <p id="invite-expires" class="expires-label"></p>
        <div class="modal-actions">
          <button class="primary-button modal-close" type="button">닫기</button>
        </div>
      </form>
    </dialog>
    <dialog id="pwa-dialog" class="modal" aria-labelledby="pwa-dialog-title">
      <form method="dialog">
        <div class="modal-head">
          <h2 id="pwa-dialog-title">앱 설치 및 알림</h2>
          <button class="icon-button modal-close" type="submit" aria-label="닫기">×</button>
        </div>
        <p id="pwa-dialog-message" class="modal-copy"></p>
        <div class="modal-actions"><button class="primary-button" type="submit" autofocus>확인</button></div>
      </form>
    </dialog>
    <div id="toast" class="toast" popover="manual" role="status" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
